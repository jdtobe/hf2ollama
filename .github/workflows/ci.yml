name: CI

on:
  # Every tracked change, including docs, runs the identity scan.
  push:
  pull_request:
  workflow_call:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

# Releases are built by release.yml.
# Actions are pinned to major tags. TODO: pin each action to a full commit SHA
# (a follow-up, tracked in docs/ROADMAP.md).
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Linux GUI dependencies
        if: runner.os == 'Linux'
        # Windowing and graphics libraries for eframe/winit. The file dialog
        # (rfd with xdg-portal) talks D-Bus in pure Rust and needs no GTK.
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libx11-dev libgl1-mesa-dev
      - run: cargo fmt --check
      - run: python3 packaging/macos/make_icon.py --check
      - run: PYTHONDONTWRITEBYTECODE=1 python3 scripts/test_check_roost_identity.py
      - run: python3 scripts/check_roost_identity.py
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  dev-hooks:
    # The screenshot/trial hooks are compiled out by default; keep them
    # building and tested.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Linux GUI dependencies
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libx11-dev libgl1-mesa-dev
      - run: cargo clippy --workspace --all-targets --features roost-gui/dev-hooks -- -D warnings
      - run: cargo test --workspace --features roost-gui/dev-hooks
