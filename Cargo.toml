[workspace]
resolver = "2"
members = ["crates/roost-core", "crates/roost-gui"]

[workspace.package]
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["Jonathan Tobe"]
# The highest `rust-version` declared by any dependency (eframe/egui 0.37 and
# sysinfo 0.39 declare 1.95), `cargo +1.95 check --workspace --all-targets` passes.
rust-version = "1.95"
publish = false
