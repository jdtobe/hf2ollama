[package]
name = "hf2ollama-core"
version = "0.1.0"
edition = "2021"

[dependencies]
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "stream", "json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "fs", "io-util", "sync", "time"] }

[dev-dependencies]
tempfile = "3.27.0"
wiremock = "0.6.5"
