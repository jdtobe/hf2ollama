name: CI

# Builds and tests the code, so only changes the build depends on start it:
# the Rust sources and assets, the manifests and lock file, the formatter
# settings and this file. Docs, packaging scripts and the like do not.
# `identity.yml` (repository checks, cheap) runs on every change, and
# `deny.yml` on dependency changes. A release calls this workflow and always
# runs all of it.
on:
  push:
    branches: [main]
    paths:
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rustfmt.toml"
      - ".rustfmt.toml"
      - "clippy.toml"
      - ".clippy.toml"
      - "rust-toolchain"
      - "rust-toolchain.toml"
      - ".cargo/**"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rustfmt.toml"
      - ".rustfmt.toml"
      - "clippy.toml"
      - ".clippy.toml"
      - "rust-toolchain"
      - "rust-toolchain.toml"
      - ".cargo/**"
      - ".github/workflows/ci.yml"
  workflow_call:
  workflow_dispatch:

# A new push to a pull request replaces the run still going for it. Other
# runs (main, a release's call) get a group of their own and are never cut.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

# Releases are built by release.yml.
# Actions are pinned to major tags. TODO: pin each action to a full commit SHA
# (a follow-up, tracked in docs/ROADMAP.md).
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Linux GUI dependencies
        if: runner.os == 'Linux'
        # Windowing and graphics libraries for eframe/winit. The file dialog
        # (rfd with xdg-portal) talks D-Bus in pure Rust and needs no GTK.
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libx11-dev libgl1-mesa-dev
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  dev-hooks:
    # The screenshot/trial hooks are compiled out by default; keep them
    # building and tested.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Linux GUI dependencies
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libx11-dev libgl1-mesa-dev
      - run: cargo clippy --workspace --all-targets --features roost-gui/dev-hooks -- -D warnings
      - run: cargo test --workspace --features roost-gui/dev-hooks
