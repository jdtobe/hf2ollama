[package]
name = "hf2ollama-gui"
version = "0.1.0"
edition = "2021"

[features]
# Screenshot and trial hooks (in-memory token store). Off in release builds.
dev-hooks = []

[dependencies]
eframe = "0.37"
egui_extras = "0.37"
hf2ollama-core = { version = "0.1.0", path = "../hf2ollama-core" }
pulldown-cmark = { version = "0.13.5", default-features = false }
rfd = { version = "0.17.2", default-features = false, features = ["xdg-portal"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "sync", "time"] }

[dev-dependencies]
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread"] }
serde_json = "1.0.154"
tempfile = "3.27.0"
wiremock = "0.6.5"
