name: CI

on:
  # Tests run on every push except main (main is tested by release.yml, which
  # calls this workflow before it builds anything) and on pull requests.
  push:
    branches-ignore: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE-*"
      - ".github/ISSUE_TEMPLATE/**"
  pull_request:
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE-*"
      - ".github/ISSUE_TEMPLATE/**"
  workflow_call:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

# Releases are built by release.yml.
# Actions are pinned to major tags. TODO: pin each action to a full commit SHA
# (a follow-up, tracked in docs/ROADMAP.md).
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Linux GUI dependencies
        if: runner.os == 'Linux'
        # Windowing and graphics libraries for eframe/winit. The file dialog
        # (rfd with xdg-portal) talks D-Bus in pure Rust and needs no GTK.
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libx11-dev libgl1-mesa-dev
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  dev-hooks:
    # The screenshot/trial hooks are compiled out by default; keep them
    # building and tested.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Linux GUI dependencies
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libx11-dev libgl1-mesa-dev
      - run: cargo clippy --workspace --all-targets --features hf2ollama-gui/dev-hooks -- -D warnings
      - run: cargo test --workspace --features hf2ollama-gui/dev-hooks
