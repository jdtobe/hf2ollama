name: Release

# Run by hand from the Actions tab (Run workflow). It tests the code, builds
# macOS, Windows and Linux, and, only when "publish" is ticked and the run is
# on main, publishes a GitHub release named YY.M.N (year without the century,
# month without a leading zero, and the number of the release within that
# month, counting from 0), for example v26.10.0. Without "publish" it only
# builds and keeps the archives as run artifacts: a dry run.
#
# To release automatically on every code merge later, add this under `on:`
# and drop the `publish` condition on the publish job:
#   push:
#     branches: [main]
#     paths-ignore: ["**.md", "docs/**", "LICENSE-*", ".github/ISSUE_TEMPLATE/**"]
on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish a GitHub release (only honoured on main); leave unticked for a build-only dry run"
        type: boolean
        default: false

# One run at a time, so two releases cannot pick the same number.
concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  version:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.next.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: next
        run: |
          prefix="$(date -u +%y).$(date -u +%-m)"
          last="$(git tag --list "v${prefix}.*" | sed "s/^v${prefix}\.//" | grep -E '^[0-9]+$' | sort -n | tail -1)"
          # The first release of a month is .0, the next .1, and so on.
          if [ -z "$last" ]; then n=0; else n=$(( last + 1 )); fi
          echo "version=${prefix}.${n}" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    strategy:
      fail-fast: true
      matrix:
        include:
          - { name: macos-arm64, os: macos-latest, target: aarch64-apple-darwin }
          - { name: macos-x86_64, os: macos-latest, target: x86_64-apple-darwin }
          - { name: windows-x86_64, os: windows-latest, target: x86_64-pc-windows-msvc }
          - { name: linux-x86_64, os: ubuntu-latest, target: x86_64-unknown-linux-gnu }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Linux GUI dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libx11-dev libgl1-mesa-dev
      - name: Stamp the version
        # Only in this build; the repository keeps its own version numbers.
        shell: bash
        run: |
          for f in crates/*/Cargo.toml; do
            sed -i.bak -E 's/^version = "[0-9]+\.[0-9]+\.[0-9]+"/version = "${{ needs.version.outputs.version }}"/' "$f"
            sed -i.bak -E 's/(hf2ollama-core = \{ version = )"[^"]+"/\1"${{ needs.version.outputs.version }}"/' "$f"
            rm -f "$f.bak"
          done
      - run: cargo build --release -p hf2ollama-gui --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          out="hf2ollama-${{ needs.version.outputs.version }}-${{ matrix.name }}"
          mkdir -p "$out" dist
          cp LICENSE-MIT LICENSE-APACHE THIRD_PARTY_LICENSES.md README.md "$out/"
          if [ "$RUNNER_OS" = "Windows" ]; then
            cp "target/${{ matrix.target }}/release/hf2ollama-gui.exe" "$out/"
            7z a "dist/$out.zip" "$out" > /dev/null
          else
            cp "target/${{ matrix.target }}/release/hf2ollama-gui" "$out/"
            tar -czf "dist/$out.tar.gz" "$out"
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

  publish:
    # A release comes only from main and only when asked for.
    if: inputs.publish && github.ref == 'refs/heads/main'
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS.txt
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          cat > notes.md <<'NOTES'
          Unsigned builds. Your OS may warn the first time you open one.

          - **macOS:** after extracting, run `xattr -dr com.apple.quarantine hf2ollama-*` or right-click the file and choose Open.
          - **Windows:** SmartScreen may say the publisher is unknown; choose More info, then Run anyway.
          - **Linux:** extract, then run `./hf2ollama-gui`. It needs a running Ollama (default `http://localhost:11434`).

          Verify downloads against `SHA256SUMS.txt`.
          NOTES
          gh release create "v${VERSION}" dist/* \
            --target "${GITHUB_SHA}" \
            --title "${VERSION}" \
            --generate-notes \
            --notes-file notes.md
